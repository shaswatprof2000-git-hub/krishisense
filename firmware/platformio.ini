; KrishiSense field station firmware
; Build & flash:  pio run -e esp32dev -t upload   then   pio device monitor
; Copy include/config.example.h to include/config.h and fill it in first.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    bblanchon/ArduinoJson@^7.0.0

; Classic ESP32 DevKit (cheapest, recommended for v1)
[env:esp32dev]
board = esp32dev
build_flags =
    -DPIN_SOIL_TOP=34
    -DPIN_SOIL_DEEP=35
    -DPIN_BATTERY=33
    -DPIN_SENSOR_POWER=25
    -DPIN_PUMP_RELAY=26
    -DPIN_I2C_SDA=21
    -DPIN_I2C_SCL=22

; ESP32-S3 DevKitC (same code, different ADC1 pins)
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DPIN_SOIL_TOP=4
    -DPIN_SOIL_DEEP=5
    -DPIN_BATTERY=6
    -DPIN_SENSOR_POWER=15
    -DPIN_PUMP_RELAY=16
    -DPIN_I2C_SDA=8
    -DPIN_I2C_SCL=9
